<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBONPAN - Live Flight Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --surface: #080c14; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--surface); color: #e0e6ed; }
        .glass-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .plane-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        .plane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .callsign { font-size: 20px; font-weight: bold; font-family: monospace; letter-spacing: 1px; }
        .airline-info { font-size: 13px; color: #38bdf8; margin-bottom: 12px; font-style: italic; }
        .badge { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; }
        .radar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 13px; color: #cbd5e1; background: #0b1120; padding: 10px 12px; border-radius: 8px; }
        .val { color: #fff; font-weight: 600; font-family: monospace; }
        .map-btn { display: block; text-align: center; background: #00f0ff15; border: 1px solid #00f0ff40; color: #00f0ff; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 12px; font-weight: 500; font-size: 13px; transition: 0.2s; }
        .map-btn:hover { background: #00f0ff25; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-4xl flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-800 pb-4 gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-white uppercase flex items-center gap-2">
                <span class="material-icons-round text-sky-400 text-3xl">radar</span>
                UBONPAN <span class="text-sky-400">Flight Radar Hub</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">Processed via GitHub Actions & OpenSky Network</p>
        </div>
        <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs">
            <span id="web-time" class="font-mono text-sky-400 font-bold">00:00:00</span>
            <span class="text-slate-600">|</span>
            <span id="radar-status" class="text-emerald-400">● SYNCED WITH GITHUB</span>
        </div>
    </header>

    <main class="w-full max-w-4xl space-y-4">
        <div class="glass-card p-6 border-t-4 border-t-sky-500">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-bold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                    <span class="material-icons-round">flight</span> เที่ยวบินที่ตรวจพบในรัศมีเรดาร์
                </h2>
                <span id="target-count" class="text-xs font-mono bg-sky-950 text-sky-300 px-3 py-1 rounded-full border border-sky-800">TARGETS: 0</span>
            </div>
            
            <div id="flight-radar-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center text-slate-500 py-12">กำลังโหลดข้อมูลจาก GitHub...</div>
            </div>
        </div>
    </main>

    <script>
        const planeHexColors = ["#00f0ff", "#ff00ff", "#ffe600", "#ff8000", "#ffffff"];

        function getAirlineDetails(callsign) {
            callsign = callsign.toUpperCase();
            if (callsign.startsWith("THA")) return "Thai Airways (การบินไทย - Widebody/Narrowbody)";
            if (callsign.startsWith("BKP")) return "Bangkok Airways (บางกอกแอร์เวย์ส - Boutique Airline)";
            if (callsign.startsWith("AIQ")) return "Thai AirAsia (ไทยแอร์เอเชีย - Airbus A320)";
            if (callsign.startsWith("TVJ")) return "Thai Vietjet Air (ไทยเวียตเจ็ท - Airbus A320/A321)";
            if (callsign.startsWith("NOK")) return "Nok Air (นกแอร์ - Boeing 737 / Dash 8)";
            if (callsign.startsWith("SLK") || callsign.startsWith("THAI LION")) return "Thai Lion Air (ไทยไลอ้อนแอร์ - Boeing 737)";
            if (callsign.startsWith("SCO")) return "Scoot (สกู๊ต - Boeing 787 Dreamliner)";
            if (callsign.startsWith("SIA")) return "Singapore Airlines (สิงคโปร์แอร์ไลน์ - Long Haul)";
            return "Commercial Flight (เที่ยวบินพาณิชย์ทั่วไป)";
        }

        async function loadFlightData() {
            try {
                // ดึงข้อมูลจากไฟล์ JSON ที่ GitHub Actions อัปเดตให้
                const response = await fetch(`flights.json?_=${Date.now()}`);
                if (response.ok) {
                    const planes = await response.json();
                    renderFlightRadar(planes);
                }
            } catch (error) {
                document.getElementById('radar-status').innerHTML = "<span class='text-rose-400'>ไม่สามารถโหลดข้อมูลได้</span>";
            }
        }

        function renderFlightRadar(planes) {
            const container = document.getElementById('flight-radar-container');
            document.getElementById('target-count').innerText = `TARGETS: ${planes.length}`;
            
            if(planes.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">ท้องฟ้าโปร่งใส ไม่พบอากาศยานในระยะเรดาร์ขณะนี้</div>`;
                return;
            }

            let html = "";
            planes.forEach((plane, i) => {
                let themeColor = (i < 5) ? planeHexColors[i] : "#ffffff";
                let airlineFull = getAirlineDetails(plane.callsign);
                
                html += `
                <div class='plane-card' style='border-left: 4px solid ${themeColor};'>
                    <div class='plane-header'>
                        <span class='callsign' style='color:${themeColor};'>${plane.callsign}</span>
                        <span class='badge' style='background-color:${themeColor}; color:${themeColor};'></span>
                    </div>
                    <div class='airline-info'>${airlineFull}</div>
                    <div class='radar-grid'>
                        <div>ALTITUDE: <br><span class='val'>${Math.round(plane.alt)} เมตร</span></div>
                        <div>SPEED: <br><span class='val'>${Math.round(plane.speed * 3.6)} กม./ชม.</span></div>
                        <div>LATITUDE: <br><span class='val'>${plane.lat.toFixed(4)}</span></div>
                        <div>LONGITUDE: <br><span class='val'>${plane.lon.toFixed(4)}</span></div>
                    </div>
                    <a class='map-btn' href='https://maps.google.com/?q=${plane.lat},${plane.lon}' target='_blank'>📍 เปิดพิกัดสดบน Google Maps</a>
                </div>`;
            });
            container.innerHTML = html;
        }

        loadFlightData();
        setInterval(loadFlightData, 30000); // รีเฟรชข้อมูลหน้าเว็บทุก 30 วิ
        setInterval(() => { document.getElementById('web-time').innerText = new Date().toLocaleTimeString('th-TH'); }, 1000);
    </script>
</body>
</html>
