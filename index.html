<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBONPAN SMART HUB - Lifestyle Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --surface: #f8fafc; --accent: #8b5cf6; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--surface); color: #334155; overflow-x: hidden; }
        .glass-light { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .config-input { background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; border-radius: 0.5rem; padding: 0.35rem 0.5rem; font-size: 0.75rem; width: 100%; transition: all 0.2s; }
        .config-input:focus { outline: none; border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2); }
        .node-name-input { background: transparent; border: none; border-bottom: 1px dashed #94a3b8; color: #0f172a; font-weight: bold; font-size: 1.125rem; outline: none; width: auto; max-width: 250px; transition: all 0.2s;}
        .node-name-input:focus { border-bottom-color: var(--primary); color: var(--primary); }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; background: #f8fafc; border: 1px solid #e2e8f0;}
        .btn-circle.active-green { background-color: #22c55e; color: white; border-color:#22c55e; box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3); }
        .btn-circle.active-blue { background-color: #0ea5e9; color: white; border-color:#0ea5e9; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); }
        .dial-container { width: 160px; height: 160px; border-radius: 50%; border: 8px solid #f1f5f9; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #toast { visibility: hidden; min-width: 280px; background-color: #ef4444; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 200; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 13px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .radar-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex">

    <div id="login-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] hidden flex justify-center items-center">
        <!-- ... (ระบบ Login ของเดิม คงไว้เหมือนเดิม) ... -->
        <div class="glass-light p-8 rounded-2xl w-85 max-w-[90%]">
            <div class="flex justify-center mb-2 text-sky-500">
                <span class="material-icons-round text-5xl">account_circle</span>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-1 text-center tracking-wide">USER SIGN IN</h3>
            <div class="space-y-4 mb-6 mt-4">
                <div>
                    <label class="text-[10px] text-slate-500 block mb-1 font-bold">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="login-user" placeholder="ระบุชื่อผู้ใช้" class="config-input text-sm p-2.5">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 block mb-1 font-bold">รหัสผ่านบัญชี</label>
                    <input type="password" id="login-pass" placeholder="ระบุรหัสผ่าน" class="config-input text-sm p-2.5">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeLogin()" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl font-bold text-xs active:scale-95 transition-all">ยกเลิก</button>
                <button onclick="doLogin()" class="flex-1 bg-sky-500 text-white py-2.5 rounded-xl font-bold text-xs active:scale-95 active:bg-sky-600 shadow-lg transition-all">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="toast" class="flex items-center gap-2 justify-center"><span class="material-icons-round text-base">gpp_maybe</span> <span id="toast-msg"></span></div>

    <aside class="w-64 glass-light border-r border-slate-200 flex flex-col fixed h-full z-50 hidden md:flex">
        <div class="p-6">
            <h1 class="text-xl font-bold text-sky-600 tracking-tight">UBONPAN</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">Smart Command Center</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="flex items-center space-x-3 p-3 rounded-xl bg-sky-50 text-sky-600 font-semibold text-sm">
                <span class="material-icons-round text-base">hub</span><span>Dashboard Overview</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 md:ml-64 p-4 md:p-6 lg:p-8 flex flex-col min-h-screen">
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4 border-b border-slate-200 pb-4">
            <div>
                <h2 class="text-2xl font-bold tracking-wider text-slate-800 uppercase">UBONPAN <span class="text-sky-500">Station</span></h2>
                <div class="flex items-center gap-2 text-slate-500 mt-1 text-xs">
                    <span id="web-time" class="font-mono text-sky-600 font-bold bg-sky-50 px-2 py-0.5 rounded border border-sky-100">00:00:00</span>
                    <span>•</span>
                    <span id="weather-location" class="flex items-center gap-1"><span class="material-icons-round text-xs">location_on</span>กำลังระบุพิกัด...</span>
                </div>
            </div>
            <!-- ... (Header ของเดิม คงไว้) ... -->
        </header>

        <!-- Weather Section (ของเดิม) -->
        <div class="glass-light p-6 md:p-8 rounded-2xl mb-8 relative border-t-4 border-t-blue-400">
            <!-- ซ่อนเนื้อหาสภาพอากาศในตัวอย่างนี้เพื่อความกระชับ แต่ของจริงคือโค้ดเดิมของคุณทั้งหมด -->
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-widest"><span class="material-icons-round text-blue-500 text-sm align-middle">public</span> สภาพอากาศ & คำแนะนำ</h3>
            <div id="lifestyle-advisor" class="mt-2 text-xs">ระบบดึงข้อมูลตามปกติ...</div>
        </div>

        <!-- NEW: Flight Radar Dashboard -->
        <div class="glass-light p-6 md:p-8 rounded-2xl mb-8 relative border-t-4 border-t-indigo-500 bg-slate-900" id="zone-radar">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <div class="flex items-center gap-3 text-white">
                    <span class="material-icons-round text-indigo-400 text-3xl">radar</span>
                    <div>
                        <h3 class="font-bold text-lg leading-tight uppercase tracking-widest">Live Flight Radar</h3>
                        <p class="text-[10px] font-medium text-slate-400">Processing Node & Data Hub for ESP32</p>
                    </div>
                </div>
                <div class="text-right">
                    <div id="radar-status" class="text-xs text-green-400 font-mono animate-pulse">● API SYNCING</div>
                    <div id="radar-count" class="text-[10px] text-slate-400 mt-1">Targets: 0</div>
                </div>
            </div>
            <div id="radar-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- เครื่องบินจะถูกเพิ่มตรงนี้ -->
            </div>
        </div>

        <!-- AC & Farm Zones (ของเดิม) -->
        <div id="dynamic-farm-container" class="space-y-8 flex-1"></div>
    </main>

    <script>
        // ================= CONFIGURATION =================
        const FIREBASE_URL = "https://ubonpan-smartfarm-default-rtdb.firebaseio.com";
        const OPENWEATHER_API_KEY = "5e88796cca9c0d5f8090cc84ea86d59d"; 
        
        // เรดาร์ Config
        const CENTER_LAT = 13.893106; 
        const CENTER_LON = 100.613921;
        const RADAR_RANGE = 0.5; 
        const LAMIN = CENTER_LAT - RADAR_RANGE;
        const LAMAX = CENTER_LAT + RADAR_RANGE;
        const LOMIN = CENTER_LON - RADAR_RANGE;
        const LOMAX = CENTER_LON + RADAR_RANGE;
        
        const planeColors = [63255, 63519, 65504, 64512, 65535]; // รหัสสี RGB565 ของ ESP32 (Cyan, Magenta, Yellow, Orange, White)
        const planeHexColors = ["#00f0ff", "#ff00ff", "#ffe600", "#ff8000", "#ffffff"];

        // ================= RADAR PROCESSING ENGINE =================
        function getAirlineDetails(callsign) {
            callsign = callsign.toUpperCase();
            if (callsign.startsWith("THA")) return "Thai Airways";
            if (callsign.startsWith("BKP")) return "Bangkok Airways";
            if (callsign.startsWith("AIQ")) return "Thai AirAsia";
            if (callsign.startsWith("TVJ")) return "Thai Vietjet Air";
            if (callsign.startsWith("NOK")) return "Nok Air";
            if (callsign.startsWith("SLK") || callsign.startsWith("THAI LION")) return "Thai Lion Air";
            if (callsign.startsWith("SCO")) return "Scoot";
            if (callsign.startsWith("SIA")) return "Singapore Airlines";
            return "Commercial Flight";
        }

        async function fetchFlightData() {
            try {
                const url = `https://opensky-network.org/api/states/all?lamin=${LAMIN}&lomin=${LOMIN}&lamax=${LAMAX}&lomax=${LOMAX}`;
                
                // ใช้ Base64 ของ ujindapan@gmail.com:Bomba021992
                const headers = new Headers();
                headers.append("Authorization", "Basic " + btoa("ujindapan@gmail.com:Bomba021992"));

                const response = await fetch(url, { headers: headers });
                if (!response.ok) throw new Error("API Limit or Network Error");
                const data = await response.json();
                
                let planes = [];
                if (data.states) {
                    data.states.forEach(state => {
                        let lon = state[5] || 0;
                        let lat = state[6] || 0;
                        if (lon === 0 || lat === 0) return;

                        // คำนวณพิกัดให้พอดีกับจอ ESP32 (128x128) ฝั่งเว็บคำนวณให้หมดเลย!
                        let mapX = ((lon - LOMIN) / (LOMAX - LOMIN)) * 128.0;
                        let mapY = 128.0 - (((lat - LAMIN) / (LAMAX - LAMIN)) * 128.0);
                        
                        if (mapX >= 0 && mapX <= 128 && mapY >= 0 && mapY <= 128) {
                            let dx = mapX - 64.0;
                            let dy = mapY - 64.0;
                            let distSq = (dx * dx) + (dy * dy);
                            
                            let callsign = state[1] ? state[1].trim() : "N/A";
                            if (callsign === "") callsign = "N/A";
                            
                            planes.push({
                                callsign: callsign,
                                airlineFull: getAirlineDetails(callsign),
                                alt: state[7] || 0,
                                speed: state[9] || 0,
                                mapX: Math.round(mapX),
                                mapY: Math.round(mapY),
                                distSq: distSq
                            });
                        }
                    });
                }

                // เรียงลำดับใกล้สุด
                planes.sort((a, b) => a.distSq - b.distSq);

                // เตรียมข้อมูล Top 5 ส่งให้ ESP32
                let esp32Payload = [];
                let htmlContent = "";

                planes.forEach((p, i) => {
                    let hexC = i < 5 ? planeHexColors[i] : "#ffffff";
                    let rgb565 = i < 5 ? planeColors[i] : 65535;

                    // สร้าง UI สำหรับหน้าเว็บ
                    htmlContent += `
                    <div class='radar-card' style='border-left: 4px solid ${hexC};'>
                        <div class='flex justify-between items-center mb-1'>
                            <span class='font-mono font-bold text-lg' style='color:${hexC};'>${p.callsign}</span>
                        </div>
                        <div class='text-xs text-sky-400 mb-2 italic'>${p.airlineFull}</div>
                        <div class='grid grid-cols-2 gap-2 text-xs text-slate-300'>
                            <div>ALT: <span class='text-white font-mono'>${Math.round(p.alt)}m</span></div>
                            <div>SPD: <span class='text-white font-mono'>${Math.round(p.speed * 3.6)}km/h</span></div>
                        </div>
                    </div>`;

                    // ข้อมูลที่ย่อยแล้ว สำหรับส่งให้ ESP32 วาดจออย่างเดียว
                    if(i < 5) {
                        esp32Payload.push({
                            c: p.callsign.substring(0,6), // ย่อให้สั้น
                            x: p.mapX,
                            y: p.mapY,
                            clr: rgb565
                        });
                    }
                });

                document.getElementById('radar-list').innerHTML = htmlContent || `<div class="text-slate-500 text-sm">ไม่พบอากาศยานในรัศมี...</div>`;
                document.getElementById('radar-count').innerText = `Targets: ${planes.length}`;

                // โยนข้อมูลที่คำนวณพิกัดเสร็จแล้ว ขึ้น Firebase ให้ ESP32 มารับไป
                fetch(`${FIREBASE_URL}/radar.json`, {
                    method: "PUT",
                    body: JSON.stringify({
                        total: planes.length,
                        planes: esp32Payload,
                        timestamp: Date.now()
                    })
                });

            } catch (error) {
                console.log("Radar API Error", error);
                document.getElementById('radar-status').innerText = "● API ERROR";
                document.getElementById('radar-status').classList.replace("text-green-400", "text-red-500");
            }
        }

        // ================= INITIALIZATION (ของเดิม + Radar) =================
        function bootSystem() {
            // ... (โค้ดดึง Firebase ฝั่ง Farm ของเดิม) ...
            
            // สั่งดึงข้อมูลเรดาร์ทันที และทำซ้ำทุกๆ 30 วินาที
            fetchFlightData();
            setInterval(fetchFlightData, 30000); 
            
            setInterval(() => { document.getElementById('web-time').innerText = new Date().toLocaleTimeString('th-TH'); }, 1000);
        }
        
        bootSystem();
    </script>
</body>
</html>
